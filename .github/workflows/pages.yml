# Publishes a static export of the Next.js site to GitHub Pages
# (https://optivadslimited.github.io/newoptivads/). The contact form on this copy
# posts to the Vercel deployment, which hosts the /api/lead route.
#
# Repository setting required once: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # API routes cannot be statically exported; the static copy calls the Vercel endpoint instead.
      - run: rm -rf app/api
      - run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_LEAD_ENDPOINT: https://optivads-leads.vercel.app/api/lead
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
